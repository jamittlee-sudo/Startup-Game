<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gaegu:wght@400;700&family=Jua&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fffbea;
    --ink: #1a1a1a;
    --accent: #ff3b30;
    --yellow: #ffd60a;
    --mint: #00d4a0;
    --blue: #0051ff;
    --paper: #fff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    overflow-x: hidden;
  }
  body {
    font-family: 'Jua', sans-serif;
    background: var(--bg);
    background-image:
      radial-gradient(circle at 20% 20%, rgba(255, 214, 10, 0.15) 0%, transparent 40%),
      radial-gradient(circle at 80% 70%, rgba(255, 59, 48, 0.1) 0%, transparent 45%),
      repeating-linear-gradient(0deg, transparent, transparent 24px, rgba(0,0,0,0.03) 24px, rgba(0,0,0,0.03) 25px);
    color: var(--ink);
    min-height: 100vh;
    min-height: 100dvh; /* 모바일에서 주소창 고려 */
    display: flex;
    align-items: flex-start; /* 중앙 정렬 → 위에서부터 */
    justify-content: center;
    padding: 20px;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    -webkit-text-size-adjust: 100%;
  }

  .screen {
    width: 100%;
    max-width: 520px;
    background: var(--paper);
    border: 3px solid var(--ink);
    border-radius: 4px;
    box-shadow: 8px 8px 0 var(--ink);
    padding: 28px 24px;
    position: relative;
    animation: slideIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(20px) rotate(-1deg); }
    to { opacity: 1; transform: translateY(0) rotate(0); }
  }
  @keyframes wiggle {
    0%, 100% { transform: rotate(0); }
    25% { transform: rotate(-2deg); }
    75% { transform: rotate(2deg); }
  }
  @keyframes pop { 0% { transform: scale(1); } 50% { transform: scale(1.3); } 100% { transform: scale(1); } }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }

  /* ===== HUD ===== */
  .hud {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    padding-bottom: 16px;
    border-bottom: 2px dashed var(--ink);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    font-weight: 600;
  }
  .hud .day { background: var(--ink); color: var(--yellow); padding: 4px 10px; border-radius: 2px; }
  .hud .char-mini { width: 44px; height: 44px; object-fit: contain; image-rendering: pixelated; }
  .hp-bar-wrap { display: flex; align-items: center; gap: 8px; }
  .hp-bar {
    width: 110px; height: 14px;
    background: #f0f0f0;
    border: 2px solid var(--ink);
    overflow: hidden;
  }
  .hp-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--mint), var(--yellow) 70%, var(--accent));
    transition: width 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .hp-num { font-weight: 700; min-width: 50px; text-align: right; font-size: 11px; }
  .hp-num.low { color: var(--accent); animation: wiggle 0.5s infinite; }

  .eyebrow {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 8px;
    font-weight: 600;
  }
  h1 {
    font-family: 'Black Han Sans', sans-serif;
    font-size: 38px;
    line-height: 1.05;
    letter-spacing: -1px;
    margin-bottom: 14px;
  }
  h1 .hl { background: var(--yellow); padding: 0 6px; display: inline-block; transform: rotate(-1deg); }
  h2 {
    font-family: 'Black Han Sans', sans-serif;
    font-size: 26px;
    line-height: 1.15;
    margin-bottom: 12px;
  }
  p { font-size: 17px; line-height: 1.55; margin-bottom: 14px; }
  .narrator {
    font-family: 'Gaegu', cursive;
    font-size: 19px;
    background: #fff9d6;
    padding: 14px 16px;
    border-left: 5px solid var(--yellow);
    margin-bottom: 20px;
    position: relative;
  }
  .narrator::before {
    content: '💭';
    position: absolute;
    top: -12px; left: 12px;
    background: var(--paper);
    padding: 0 6px;
    font-size: 16px;
  }

  .title-char-wrap { text-align: center; margin: 20px 0 24px; }
  .title-char {
    width: 180px; height: 180px;
    image-rendering: pixelated;
    animation: bob 2s ease-in-out infinite;
  }

  /* ===== Title Meme ===== */
  .title-meme-wrap {
    text-align: center;
    margin: 24px 0;
    position: relative;
  }
  .title-meme {
    max-width: 100%;
    width: 360px;
    height: auto;
    border: 3px solid var(--ink);
    box-shadow: 8px 8px 0 var(--ink);
    display: block;
    margin: 0 auto;
    animation: memeTilt 5s ease-in-out infinite;
  }
  @keyframes memeTilt {
    0%, 100% { transform: rotate(-1deg); }
    50% { transform: rotate(1deg); }
  }

  /* ===== Small note (눈에 더 잘 띄게) ===== */
  p.small-note, div.small-note {
    font-family: 'Black Han Sans', sans-serif;
    font-size: 15px;
    color: var(--ink);
    text-align: center;
    margin: 14px auto;
    background: var(--yellow);
    padding: 8px 14px;
    border: 2.5px solid var(--ink);
    display: table;
    box-shadow: 3px 3px 0 var(--ink);
    transform: rotate(-1deg);
    letter-spacing: -0.3px;
    line-height: 1.35;
    max-width: 90%;
  }

  /* ===== Buttons ===== */
  .btn-stack { display: flex; flex-direction: column; gap: 10px; margin-top: 18px; }
  .btn {
    display: block;
    width: 100%;
    padding: 14px 16px;
    font-family: 'Jua', sans-serif;
    font-size: 16px;
    text-align: left;
    background: var(--paper);
    border: 2.5px solid var(--ink);
    border-radius: 3px;
    cursor: pointer;
    transition: all 0.15s ease;
    box-shadow: 4px 4px 0 var(--ink);
    color: var(--ink);
    line-height: 1.35;
  }
  .btn:hover { transform: translate(-2px, -2px); box-shadow: 6px 6px 0 var(--ink); background: var(--yellow); }
  .btn:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 var(--ink); }
  .btn .tag {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    background: var(--ink); color: var(--yellow);
    padding: 2px 6px;
    margin-right: 8px;
    letter-spacing: 1px;
    vertical-align: middle;
  }
  .btn.primary { background: var(--ink); color: var(--paper); }
  .btn.primary:hover { background: var(--accent); color: var(--paper); }

  /* ===== Job Cards ===== */
  .job-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 16px;
  }
  .job-card {
    padding: 14px 10px 12px;
    border: 2.5px solid var(--ink);
    border-radius: 3px;
    background: #f5f5f0;
    cursor: pointer;
    text-align: center;
    transition: all 0.15s ease;
    box-shadow: 4px 4px 0 var(--ink);
    position: relative;
  }
  .job-card:hover { transform: translate(-2px, -2px); box-shadow: 6px 6px 0 var(--ink); background: #fffde7; }
  .job-card:hover .pixel-char { animation: bob 0.6s ease-in-out infinite; }
  .pixel-char {
    width: 110px;
    height: 140px;
    object-fit: contain;
    image-rendering: pixelated;
    image-rendering: -moz-crisp-edges;
    image-rendering: crisp-edges;
    display: block;
    margin: 0 auto 6px;
  }
  .job-card .name {
    font-size: 15px;
    font-weight: 700;
    font-family: 'Black Han Sans';
    letter-spacing: -0.5px;
  }
  .job-card .sub {
    font-family: 'Black Han Sans', sans-serif;
    font-size: 11px;
    color: #999;
    margin-top: 1px;
    letter-spacing: -0.3px;
  }
  .job-card .hp-badge {
    position: absolute;
    top: -10px; right: -8px;
    background: var(--accent);
    color: white;
    font-family: 'Black Han Sans', sans-serif;
    font-size: 16px;
    padding: 4px 10px;
    border: 3px solid var(--ink);
    transform: rotate(6deg);
    box-shadow: 2px 2px 0 var(--ink);
    animation: wiggle 2s ease-in-out infinite;
    letter-spacing: -0.5px;
  }
  .job-card .hp-badge.mild {
    background: var(--yellow);
    color: var(--ink);
    font-size: 14px;
  }
  .job-card .ai-warn {
    position: absolute;
    top: 6px; left: 6px;
    background: var(--ink);
    color: var(--accent);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 8px;
    padding: 2px 5px;
    letter-spacing: 1px;
    font-weight: 700;
  }

  /* ===== Dungeon ===== */
  .dungeon-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 16px 0; }
  .tile {
    aspect-ratio: 1;
    background: #2a2a2a;
    border: 2px solid var(--ink);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    color: transparent;
    transition: all 0.2s ease;
    border-radius: 2px;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  .tile:hover:not(.opened), .tile:active:not(.opened) { background: #444; transform: scale(0.95); }
  .tile.opened { background: var(--paper); color: var(--ink); animation: pop 0.3s ease; }
  .tile.found { background: var(--mint); border-color: var(--ink); }
  .tile.trap { background: var(--accent); }
  .dungeon-info {
    display: flex; justify-content: space-between;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px; font-weight: 600;
    margin-top: 8px;
  }

  /* ===== Transition Overlay (Day 3 방호복 갈아입기) ===== */
  .transition-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.92);
    z-index: 200;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    animation: fadeIn 0.3s ease;
    padding: 20px;
    text-align: center;
    overflow-y: auto;
  }
  @keyframes fadeIn { from { opacity: 0; } }
  .transition-label {
    color: var(--yellow);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    letter-spacing: 3px;
    margin-bottom: 20px;
    animation: blink 0.8s ease-in-out infinite;
  }
  @keyframes blink { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }
  .transition-title {
    color: white;
    font-family: 'Black Han Sans', sans-serif;
    font-size: 32px;
    margin-bottom: 30px;
    letter-spacing: -1px;
  }
  .transition-char {
    width: 200px;
    height: 260px;
    object-fit: contain;
    image-rendering: pixelated;
    image-rendering: -moz-crisp-edges;
    image-rendering: crisp-edges;
    animation: charSwap 2.6s ease forwards;
  }
  @keyframes charSwap {
    0% { transform: scale(1); filter: brightness(1); }
    35% { transform: scale(0.8) rotate(-5deg); filter: brightness(0.6) blur(2px); }
    50% { transform: scale(0.5) rotate(10deg); filter: brightness(0.3) blur(4px); }
    65% { transform: scale(0.8) rotate(-3deg); filter: brightness(0.6) blur(2px); }
    100% { transform: scale(1); filter: brightness(1); }
  }
  .transition-flash {
    position: absolute;
    inset: 0;
    background: radial-gradient(circle, var(--yellow) 0%, transparent 70%);
    opacity: 0;
    animation: flash 2.6s ease forwards;
    pointer-events: none;
  }
  @keyframes flash {
    0%, 40%, 60%, 100% { opacity: 0; }
    50% { opacity: 0.7; }
  }
  .transition-caption {
    color: #ffd60a;
    font-family: 'Gaegu', cursive;
    font-size: 20px;
    margin-top: 20px;
    font-weight: 700;
  }
  .job-title-badge {
    margin-top: 16px;
    padding: 8px 20px;
    background: var(--yellow);
    color: var(--ink);
    font-family: 'Black Han Sans';
    font-size: 22px;
    border: 3px solid var(--yellow);
    transform: rotate(-2deg);
    animation: badgeIn 0.4s 1.8s ease forwards;
    opacity: 0;
  }
  @keyframes badgeIn {
    from { opacity: 0; transform: rotate(-2deg) scale(0.5); }
    to { opacity: 1; transform: rotate(-2deg) scale(1); }
  }

  /* ===== Term Quiz ===== */
  /* Meeting Room Vibe */
  .meeting-room {
    background: linear-gradient(180deg, #2a3f5f 0%, #1e2f4a 100%);
    border: 3px solid var(--ink);
    border-radius: 8px;
    padding: 18px 14px 22px;
    margin: 12px 0 18px;
    position: relative;
    box-shadow: 6px 6px 0 var(--ink);
  }
  .meeting-room::before {
    content: '';
    position: absolute;
    top: -2px; left: 50%;
    transform: translateX(-50%);
    width: 50%;
    height: 30px;
    background: radial-gradient(ellipse at 50% 0%, rgba(255,230,150,0.6), transparent 70%);
    pointer-events: none;
  }
  .meeting-screen {
    background: #fffbea;
    border: 3px solid #444;
    border-radius: 4px;
    padding: 20px 16px;
    text-align: center;
    box-shadow: inset 0 0 20px rgba(0,0,0,0.1);
    position: relative;
  }
  .meeting-timer {
    position: absolute;
    top: -16px;
    right: -12px;
    background: var(--accent);
    color: #fff;
    font-family: 'Black Han Sans', sans-serif;
    font-size: 32px;
    padding: 4px 14px;
    border: 3px solid var(--ink);
    border-radius: 4px;
    box-shadow: 3px 3px 0 var(--ink);
    min-width: 50px;
    text-align: center;
    z-index: 5;
  }
  .meeting-timer.urgent {
    animation: timerPulse 0.4s ease-in-out infinite;
    background: #ff1a1a;
  }
  @keyframes timerPulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.2); }
  }
  .ceo-speaker {
    background: #1a1a1a;
    color: #fff;
    padding: 12px 14px;
    margin: 0 0 14px 0;
    font-family: 'Gaegu', cursive;
    font-size: 15px;
    font-weight: 700;
    border-radius: 4px;
    border-left: 4px solid var(--yellow);
    line-height: 1.5;
    display: flex;
    align-items: flex-start;
    gap: 10px;
  }
  .ceo-speaker::before {
    content: '👔';
    font-size: 22px;
    flex-shrink: 0;
    line-height: 1.2;
  }
  .ceo-bubble {
    background: #fffbea;
    color: #1a1a1a;
    padding: 10px 14px;
    border-radius: 12px;
    font-size: 16px;
    line-height: 1.55;
    flex: 1;
    position: relative;
    font-weight: 400;
    word-break: keep-all;
  }
  .ceo-bubble::before {
    /* 말풍선 꼬리 */
    content: '';
    position: absolute;
    left: -8px;
    top: 14px;
    width: 0;
    height: 0;
    border-top: 8px solid transparent;
    border-bottom: 8px solid transparent;
    border-right: 10px solid #fffbea;
  }
  .ceo-bubble b { color: var(--accent); font-weight: 700; font-size: 17px; }

  .quiz-term {
    font-family: 'Black Han Sans', sans-serif;
    font-size: 38px;
    color: var(--ink);
    letter-spacing: -1px;
    margin: 14px 0 6px;
    display: inline-block;
    padding: 10px 20px;
    background: var(--yellow);
    border: 3px solid var(--ink);
    transform: rotate(-1deg);
    box-shadow: 4px 4px 0 var(--ink);
    line-height: 1.1;
    max-width: 100%;
    word-break: keep-all;
  }
  .quiz-question-num {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    letter-spacing: 2px;
    color: #999;
    margin-bottom: 8px;
    text-align: center;
  }
  .quiz-center {
    text-align: center;
    margin: 18px 0;
  }
  .quiz-hint {
    font-family: 'Gaegu', cursive;
    font-size: 17px;
    color: #666;
    margin-top: 14px;
    font-weight: 700;
    line-height: 1.4;
  }
  .quiz-progress {
    display: flex;
    gap: 6px;
    justify-content: center;
    margin: 12px 0;
  }
  .quiz-dot {
    width: 12px; height: 12px;
    border: 2px solid var(--ink);
    background: #fff;
    transition: all 0.2s;
  }
  .quiz-dot.correct { background: var(--mint); }
  .quiz-dot.wrong { background: var(--accent); }
  .quiz-dot.current { background: var(--yellow); transform: scale(1.3); }
  .quiz-result-big {
    font-family: 'Black Han Sans', sans-serif;
    font-size: 42px;
    margin-bottom: 8px;
    letter-spacing: -1px;
    text-align: center;
  }
  .quiz-result-big.correct { color: var(--mint); }
  .quiz-result-big.wrong { color: var(--accent); }
  .quiz-answer-reveal {
    background: #1a1a1a;
    color: #fff;
    padding: 16px 18px;
    margin: 14px 0;
    border: 3px solid var(--ink);
    box-shadow: 4px 4px 0 var(--ink);
  }
  .quiz-answer-reveal .term {
    font-family: 'Black Han Sans', sans-serif;
    font-size: 22px;
    color: var(--yellow);
    margin-bottom: 6px;
    letter-spacing: -0.5px;
    line-height: 1.2;
    word-break: keep-all;
  }
  .quiz-answer-reveal .desc {
    font-family: 'Jua', sans-serif;
    font-size: 16px;
    line-height: 1.5;
    color: #fff;
  }

  /* ===== Titan Arena (거인 무찌르기) ===== */
  .titan-arena {
    position: relative;
    width: 100%;
    height: 400px;
    background:
      linear-gradient(180deg, #8ec5e8 0%, #c5e0f0 40%, #d9a574 60%, #8b6239 100%);
    border: 3px solid var(--ink);
    border-radius: 4px;
    overflow: hidden;
    margin: 16px 0;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
  }
  .titan-arena::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
      repeating-linear-gradient(90deg,
        transparent 0%, transparent 32%,
        rgba(0,0,0,0.15) 32%, rgba(0,0,0,0.15) 34%,
        transparent 34%, transparent 66%,
        rgba(0,0,0,0.15) 66%, rgba(0,0,0,0.15) 68%,
        transparent 68%, transparent 100%);
    pointer-events: none;
  }
  .titan-player {
    position: absolute;
    bottom: 8px;
    left: 50%;
    transform: translateX(-50%);
    width: 80px;
    height: 100px;
    object-fit: contain;
    image-rendering: pixelated;
    image-rendering: -moz-crisp-edges;
    image-rendering: crisp-edges;
    transition: left 0.15s cubic-bezier(0.34, 1.56, 0.64, 1);
    z-index: 5;
  }
  .titan-player.attack { animation: attackPose 0.3s ease; }
  @keyframes attackPose {
    0%, 100% { transform: translateX(-50%) scale(1); }
    50% { transform: translateX(-50%) scale(1.15) rotate(-5deg); }
  }

  .titan {
    position: absolute;
    width: 72px; height: 96px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    padding: 2px 2px 6px;
    transition: top 0.1s linear;
    font-family: 'Black Han Sans', sans-serif;
    filter: drop-shadow(0 3px 0 rgba(0,0,0,0.25));
  }
  .titan-img {
    position: absolute;
    top: 0; left: 50%;
    transform: translateX(-50%);
    width: 72px;
    height: 90px;
    object-fit: contain;
    image-rendering: pixelated;
    image-rendering: -moz-crisp-edges;
    image-rendering: crisp-edges;
    z-index: 1;
    pointer-events: none;
  }
  .titan .titan-label {
    background: rgba(26,26,26,0.92);
    color: #fff;
    padding: 2px 6px;
    font-size: 11px;
    border-radius: 3px;
    white-space: nowrap;
    letter-spacing: -0.3px;
    font-weight: 700;
    max-width: 64px;
    overflow: hidden;
    text-overflow: ellipsis;
    z-index: 3;
    position: relative;
    margin-bottom: 2px;
  }
  .titan.slain {
    animation: titanSlain 0.5s ease forwards;
    pointer-events: none;
  }
  @keyframes titanSlain {
    0%   { transform: scale(1) rotate(0); opacity: 1; filter: brightness(1); }
    20%  { transform: scale(1.2) rotate(-5deg); filter: brightness(1.8) hue-rotate(-20deg); }
    60%  { transform: scale(1.1) rotate(10deg); filter: brightness(0.6) blur(2px); opacity: 0.8; }
    100% { transform: scale(0.2) rotate(180deg) translateY(30px); opacity: 0; filter: blur(8px); }
  }
  /* 피튀김 → 번쩍이는 빛 플래시 효과 */
  .blood-splat {
    position: absolute;
    pointer-events: none;
    width: 80px;
    height: 80px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,0.95) 0%, rgba(255,255,150,0.7) 30%, transparent 70%);
    animation: lightFlash 0.5s ease-out forwards;
    z-index: 10;
    mix-blend-mode: screen;
  }
  @keyframes lightFlash {
    0%   { transform: scale(0.3); opacity: 0; }
    30%  { transform: scale(1.4); opacity: 1; }
    100% { transform: scale(2.2); opacity: 0; }
  }
  /* 증기 → 십자 광선 폭발 효과 */
  .steam-puff {
    position: absolute;
    pointer-events: none;
    width: 60px;
    height: 4px;
    background: linear-gradient(90deg, transparent, #fff 20%, #ffd60a 50%, #fff 80%, transparent);
    animation: beamBurst 0.6s ease-out forwards;
    z-index: 9;
    transform-origin: center;
    box-shadow: 0 0 8px #ffd60a, 0 0 16px rgba(255, 214, 10, 0.5);
  }
  @keyframes beamBurst {
    0%   { transform: scale(0.2) rotate(var(--beam-angle, 0deg)); opacity: 0; }
    30%  { transform: scale(1.3) rotate(var(--beam-angle, 0deg)); opacity: 1; }
    100% { transform: scale(2) rotate(var(--beam-angle, 0deg)); opacity: 0; }
  }
  /* 검격 광선 - 더 강하게 */
  .slash-fx {
    position: absolute;
    width: 120px; height: 8px;
    background: linear-gradient(90deg, transparent, #fff 30%, #ffd60a 50%, #fff 70%, transparent);
    pointer-events: none;
    animation: slashFx 0.4s ease forwards;
    z-index: 11;
    box-shadow:
      0 0 10px #fff,
      0 0 20px #ffd60a,
      0 0 30px rgba(255, 214, 10, 0.6);
    filter: brightness(1.5);
  }
  @keyframes slashFx {
    0%   { opacity: 0; transform: scaleX(0.3) rotate(-20deg); }
    40%  { opacity: 1; transform: scaleX(1.8) rotate(-20deg); }
    100% { opacity: 0; transform: scaleX(2.5) rotate(-20deg); }
  }

  .slash-fx {
    position: absolute;
    width: 80px; height: 6px;
    background: linear-gradient(90deg, transparent, #fff, transparent);
    pointer-events: none;
    animation: slashFx 0.3s ease forwards;
    z-index: 6;
  }
  @keyframes slashFx {
    0% { opacity: 1; transform: scaleX(0.5); }
    50% { opacity: 1; transform: scaleX(1.5); }
    100% { opacity: 0; transform: scaleX(2); }
  }

  .task-popup {
    position: absolute;
    background: var(--yellow);
    color: var(--ink);
    border: 3px solid var(--ink);
    padding: 6px 10px;
    font-family: 'Black Han Sans', sans-serif;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: -0.3px;
    pointer-events: none;
    animation: taskPop 0.9s ease-out forwards;
    z-index: 7;
    white-space: nowrap;
    box-shadow: 3px 3px 0 var(--ink);
    transform: rotate(-4deg);
  }
  @keyframes taskPop {
    0% { opacity: 0; transform: translateY(0) rotate(-4deg) scale(0.5); }
    20% { opacity: 1; transform: translateY(-10px) rotate(-4deg) scale(1.1); }
    100% { opacity: 0; transform: translateY(-60px) rotate(-4deg) scale(1); }
  }

  .titan-stats {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    font-weight: 600;
    margin-top: 8px;
  }
  .titan-score {
    font-family: 'Black Han Sans';
    font-size: 20px;
    color: var(--accent);
  }

  .lane-hint {
    position: absolute;
    bottom: 90px;
    left: 50%;
    transform: translateX(-50%);
    color: #fff;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 2px;
    background: rgba(0,0,0,0.5);
    padding: 4px 10px;
    z-index: 4;
    animation: fadeOut 2s 1s forwards;
  }
  @keyframes fadeOut { to { opacity: 0; } }

  /* ===== Wasp Arena ===== */
  .wasp-arena {
    position: relative;
    height: 320px;
    background:
      radial-gradient(circle at 30% 40%, rgba(255, 214, 10, 0.3), transparent 50%),
      radial-gradient(circle at 70% 60%, rgba(255, 59, 48, 0.2), transparent 50%),
      #fff9e6;
    border: 3px solid var(--ink);
    border-radius: 4px;
    overflow: hidden;
    cursor: crosshair;
    margin: 16px 0;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  .player-in-arena {
    position: absolute;
    bottom: 6px;
    left: 50%;
    width: 90px;
    height: 120px;
    object-fit: contain;
    image-rendering: pixelated;
    image-rendering: -moz-crisp-edges;
    image-rendering: crisp-edges;
    pointer-events: none;
    z-index: 5;
  }
  .wasp {
    position: absolute;
    font-size: 36px;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    transition: transform 0.08s ease;
    filter: drop-shadow(2px 2px 0 rgba(0,0,0,0.3));
    padding: 8px;
    margin: -8px;
  }
  .wasp:hover, .wasp:active { transform: scale(1.25); }
  .wasp-stats {
    display: flex; justify-content: space-between;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px; font-weight: 600;
    margin-top: 8px;
  }
  .combo { color: var(--accent); font-size: 16px; }
  .voc-bubble {
    position: absolute;
    background: var(--ink);
    color: var(--yellow);
    border: 3px solid var(--ink);
    padding: 6px 12px;
    font-size: 15px;
    font-family: 'Black Han Sans', sans-serif;
    font-weight: 700;
    letter-spacing: -0.3px;
    pointer-events: none;
    animation: floatUp 1.3s ease-out forwards;
    white-space: nowrap;
    border-radius: 4px;
    box-shadow: 3px 3px 0 rgba(0,0,0,0.25);
    z-index: 10;
  }
  .voc-bubble::after {
    /* 말풍선 꼬리 */
    content: '';
    position: absolute;
    bottom: -10px;
    left: 16px;
    width: 0; height: 0;
    border-left: 8px solid transparent;
    border-right: 8px solid transparent;
    border-top: 10px solid var(--ink);
  }
  @keyframes floatUp {
    0% { opacity: 0; transform: translateY(10px) scale(0.6); }
    15% { opacity: 1; transform: translateY(0) scale(1.1); }
    25% { transform: translateY(-4px) scale(1); }
    75% { opacity: 1; transform: translateY(-30px) scale(1); }
    100% { opacity: 0; transform: translateY(-60px) scale(0.9); }
  }

  /* ===== Modal Popup ===== */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.7);
    z-index: 300;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    animation: fadeIn 0.3s ease;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  .modal {
    background: var(--paper);
    border: 3px solid var(--ink);
    box-shadow: 8px 8px 0 rgba(0,0,0,0.5);
    max-width: 440px;
    width: 100%;
    padding: 28px 24px;
    position: relative;
    animation: modalIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    max-height: calc(100vh - 40px);
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  @keyframes modalIn {
    from { opacity: 0; transform: scale(0.7) rotate(-2deg); }
    to { opacity: 1; transform: scale(1) rotate(0); }
  }
  .modal-badge {
    display: inline-block;
    background: var(--ink);
    color: var(--yellow);
    padding: 4px 10px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    letter-spacing: 2px;
    margin-bottom: 12px;
  }
  .modal h3 {
    font-family: 'Black Han Sans';
    font-size: 22px;
    line-height: 1.2;
    margin-bottom: 14px;
    color: var(--ink);
  }
  .modal p { font-size: 15px; margin-bottom: 14px; }
  .movie-quote {
    background: #1a1a1a;
    color: var(--yellow);
    padding: 16px;
    margin: 16px 0;
    border-left: 5px solid var(--accent);
    font-family: 'Gaegu', cursive;
    font-size: 18px;
    line-height: 1.45;
    position: relative;
  }
  .movie-quote::before {
    content: '"';
    position: absolute;
    top: -8px; left: 8px;
    font-size: 60px;
    color: var(--accent);
    font-family: Georgia, serif;
    line-height: 1;
  }
  .movie-quote .source {
    display: block;
    text-align: right;
    font-size: 12px;
    color: #aaa;
    font-family: 'IBM Plex Mono', monospace;
    margin-top: 8px;
    letter-spacing: 1px;
  }

  /* ===== Ending ===== */
  .stamp {
    font-family: 'Black Han Sans';
    font-size: 54px;
    color: var(--accent);
    border: 5px solid var(--accent);
    padding: 12px 24px;
    display: inline-block;
    transform: rotate(-6deg);
    margin: 20px 0;
    letter-spacing: -2px;
    opacity: 0.9;
  }
  .ending-char {
    width: 140px;
    height: 180px;
    object-fit: contain;
    image-rendering: pixelated;
    image-rendering: -moz-crisp-edges;
    image-rendering: crisp-edges;
    display: block;
    margin: 0 auto 12px;
  }
  .stats-box {
    background: #f7f7f2;
    border: 2px solid var(--ink);
    padding: 14px;
    margin: 16px 0;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
  }
  .stats-box div { display: flex; justify-content: space-between; padding: 4px 0; }
  .stats-box div + div { border-top: 1px dashed #ccc; }

  .reveal {
    background: #1a1a1a;
    color: #fff;
    padding: 20px 18px;
    border: 3px solid var(--ink);
    margin-top: 14px;
    animation: slideIn 0.4s ease;
    box-shadow: 4px 4px 0 var(--ink);
  }
  .reveal h3 {
    font-family: 'Black Han Sans', sans-serif;
    font-size: 24px;
    color: var(--yellow);
    margin-bottom: 12px;
    letter-spacing: -0.5px;
    line-height: 1.2;
  }
  .reveal p {
    font-size: 18px;
    margin-bottom: 0;
    color: #fff;
    font-family: 'Jua', sans-serif;
    font-weight: 400;
    line-height: 1.5;
    letter-spacing: -0.2px;
  }
  .reveal p b { color: var(--yellow); }

  .toast {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: var(--ink);
    color: var(--yellow);
    padding: 18px 28px;
    font-family: 'Black Han Sans', sans-serif;
    font-size: 22px;
    font-weight: 700;
    z-index: 400;
    border: 4px solid var(--yellow);
    border-radius: 4px;
    box-shadow: 6px 6px 0 rgba(0,0,0,0.3), 0 0 30px rgba(255, 214, 10, 0.5);
    animation: toastIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), toastOut 0.3s ease 1.7s forwards;
    letter-spacing: -0.5px;
    text-align: center;
    pointer-events: none;
    white-space: pre-line;
    line-height: 1.3;
  }
  .toast.dmg { color: #ff6b5a; border-color: var(--accent); }
  .toast.heal { color: var(--mint); border-color: var(--mint); }
  @keyframes toastIn { from { opacity: 0; transform: translate(-50%, -50%) scale(0.7); } }
  @keyframes toastOut { to { opacity: 0; transform: translate(-50%, -50%) scale(1.2); } }
  .disclaimer {
    text-align: center;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    color: #888;
    margin-top: 16px;
    line-height: 1.5;
  }

  @media (max-width: 480px) {
    body { padding: 10px 10px 40px 10px; }
    h1 { font-size: 30px; }
    h2 { font-size: 22px; }
    .screen {
      padding: 20px 16px;
      box-shadow: 4px 4px 0 var(--ink);
      max-width: 100%;
    }
    .pixel-char { width: 86px; height: 110px; }
    .wasp-arena { height: 320px; }
    .titan-arena { height: 360px; }
    .titan { width: 60px; height: 80px; }
    .titan-img { width: 60px; height: 76px; }
    .titan .titan-label { font-size: 9px; max-width: 52px; }
    .transition-char { width: 150px; height: 196px; }
    .transition-title { font-size: 22px; text-align: center; padding: 0 16px; }
    .title-meme { width: 100%; max-width: 320px; }
    p.small-note, div.small-note { font-size: 13px; padding: 7px 12px; }
    /* Toast at top on mobile so it doesn't block mini-game */
    .toast {
      top: 70px;
      font-size: 18px;
      padding: 14px 20px;
      max-width: 90vw;
    }
    /* Modal fits mobile viewport */
    .modal {
      max-height: 85vh;
      overflow-y: auto;
      padding: 22px 18px;
      -webkit-overflow-scrolling: touch;
    }
    .modal h3 { font-size: 19px; }
    .modal p { font-size: 14px; }
    .ending-char { width: 100px; height: 100px; }
    .title-char { width: 140px; height: 140px; }
    .btn { padding: 13px 14px; font-size: 15px; }
    .narrator { font-size: 16px; padding: 12px 14px; }
    .job-grid { gap: 8px; }
    .job-card { padding: 10px 6px 10px; }
    .job-card .name { font-size: 13px; }
    .job-card .sub { font-size: 8px; }
    .lane-hint { font-size: 10px; bottom: 110px; }
    .reveal { padding: 18px 16px; }
    .reveal h3 { font-size: 21px; }
    .reveal p { font-size: 16px; line-height: 1.5; }
    .quiz-term { font-size: 28px; padding: 8px 14px; }
    .quiz-answer-reveal .term { font-size: 20px; }
    .quiz-answer-reveal .desc { font-size: 14px; }
    /* Better touch targets globally */
    button, .btn { -webkit-tap-highlight-color: rgba(255, 214, 10, 0.3); touch-action: manipulation; }
    /* Disable hover on mobile (avoid sticky hover state) */
    .btn:hover { transform: none; box-shadow: 4px 4px 0 var(--ink); background: var(--paper); }
    .btn.primary:hover { background: var(--ink); color: var(--paper); }
    .job-card:hover { transform: none; box-shadow: 4px 4px 0 var(--ink); background: #f5f5f0; }
    .job-card:hover .pixel-char { animation: none; }

</style>
</head>
<body>

<div id="app" class="screen"></div>

<script>
/* =========================================================
   CHARACTER SPRITES - 이미지 파일 기반 (assets/ 폴더)
   ========================================================= */


// 제목 화면에 쓰이는 밈 이미지 (일론 머스크 프레싱 제스처)
const TITLE_MEME_SRC = "assets/elon_musk.png";

// 스프라이트 레지스트리 - 실제 이미지 파일 경로
// 기존 burnout/quit/survive는 직업별 캐릭터 이미지를 재활용
const SPRITES = {
  // 직업 캐릭터
  danso: "assets/dev_danso.png",          // 7호선 단소 개발자
  jarvan: "assets/designer_zarvan.png",   // 1호선 자르반 디자이너
  antpm: "assets/pm_ant.png",              // 동학개미 PM
  trump: "assets/marketer_trump.png",     // 도람프 마케터

  // 특수 캐릭터
  scout: "assets/eren_scout.png",         // 에렌 예거 (조사병단)
  beesuit: "assets/beesuit.png",          // 말벌아저씨 (방호복)
  elon: "assets/elon_musk.png",           // 일론 (엑싯/창업)

  // 번아웃 엔딩 전용 이미지 (쓰러진 포즈)
  danso_burnout: "assets/dev_danso_burnout.png",
  jarvan_burnout: "assets/designer_zarvan_burnout.png",
  antpm_burnout: "assets/pm_ant_burnout.png",
  trump_burnout: "assets/marketer_trump_burnout.png",

  // 엔딩 - 동적 처리 (플레이어 직업에 따라)
  exit: "assets/elon_musk.png",           // 엑싯 = 일론
  founder: "assets/elon_musk.png",        // 창업도 일론

  // 거인 5종
  titan1: "assets/titan_1.png",
  titan2: "assets/titan_2.png",
  titan3: "assets/titan_3.png",
  titan4: "assets/titan_4.png",
  titan5: "assets/titan_5.png",

  default: "assets/elon_musk.png",
};

function charImg(key, cls = 'pixel-char', attrs = '') {
  return `<img class="${cls}" src="${SPRITES[key] || SPRITES.default}" alt="char" ${attrs}>`;
}

// ============= GAME STATE =============
const state = {
  hp: 100, maxHp: 100, day: 0, job: null,
  log: [], docs: 0, vocHandled: 0, choices: [],
};

const app = document.getElementById('app');

function render(html) {
  app.innerHTML = html;
  app.style.animation = 'none';
  void app.offsetWidth;
  app.style.animation = 'slideIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1)';
}

function hud(dayLabel) {
  const hpPct = Math.max(0, Math.min(100, (state.hp / state.maxHp) * 100));
  const low = state.hp <= 30 ? 'low' : '';
  const charKey = state.beesuited ? 'beesuit'
    : state.scouted ? 'scout'
    : (state.job ? state.job.sprite : 'default');
  return `
    <div class="hud">
      <div style="display:flex;align-items:center;gap:8px;">
        ${charImg(charKey, 'char-mini')}
        <span class="day">${dayLabel}</span>
      </div>
      <div class="hp-bar-wrap">
        <span style="font-size:11px;">HP</span>
        <div class="hp-bar"><div class="hp-fill" style="width:${hpPct}%"></div></div>
        <span class="hp-num ${low}">${state.hp}/${state.maxHp}</span>
      </div>
    </div>
  `;
}

function toast(msg, type = '') {
  const t = document.createElement('div');
  t.className = 'toast' + (type ? ' ' + type : '');
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2100);
}

function hpChange(delta, reason) {
  if (state.gameOver) return; // 이미 끝났으면 더 이상 변화 X
  state.hp = Math.max(0, Math.min(state.maxHp, state.hp + delta));
  const sign = delta > 0 ? '+' : '';
  const type = delta > 0 ? 'heal' : 'dmg';
  toast(`${sign}${delta} HP\n${reason}`, type);
  state.log.push(`${sign}${delta}HP: ${reason}`);
  if (state.hp <= 0 && !state.gameOver) {
    state.gameOver = true;
    // 진행 중인 모든 타이머·인터벌 정리
    if (state._titanTimers) {
      state._titanTimers.forEach(id => { clearInterval(id); clearTimeout(id); });
      state._titanTimers = [];
    }
    if (state._waspTimers) {
      state._waspTimers.forEach(id => { clearInterval(id); clearTimeout(id); });
      state._waspTimers = [];
    }
    // 열린 모달 모두 닫기 (onClose 호출 방지)
    document.querySelectorAll('.modal-backdrop').forEach(m => m.remove());
    setTimeout(() => endGame('burnout'), 1000);
  }
}

// ============= MODAL SYSTEM =============
function showModal(html, onClose) {
  const backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop';
  backdrop.innerHTML = `<div class="modal">${html}</div>`;
  document.body.appendChild(backdrop);
  backdrop.querySelector('[data-close]')?.addEventListener('click', () => {
    backdrop.remove();
    if (onClose) onClose();
  });
}

// ============= SCREENS =============
function screenTitle() {
  state.hp = 100; state.day = 0; state.job = null;
  state.log = []; state.docs = 0; state.vocHandled = 0; state.choices = [];
  state.beesuited = false;
  state.scouted = false;
  state.gameOver = false;
  state._titanTimers = [];
  state._waspTimers = [];
  render(`
    <div class="eyebrow">직장인 편 · 시즌 1</div>

function rejectJob() {
  // Restore HP and clear job, then go back to selection
  if (state.job) {
    state.hp += state.job.penalty;
    state.job = null;
  }
  // Close any open modal without triggering its onClose
  document.querySelectorAll('.modal-backdrop').forEach(m => m.remove());
  screenJob();
}

function screenDay1() {
  if (state.gameOver) return;
  state.day = 1;
  render(`
    ${hud('DAY 1')}
    <div class="eyebrow">인수인계 던전 🗝</div>
    <h2>전임자는 이미 퇴사했다.</h2>
    <div class="narrator">
      "자료요? 아마 슬랙 어디에… 노션에도 있고… 구글드라이브에도 있고… 아 근데 권한은 대표님께…"<br><br>
      — 퇴사자 마지막 카톡
    </div>
    <p>드라이브 폴더에서 <b>핵심 자료 4개</b>를 찾으세요. 지뢰는 -8 HP.</p>
    <div class="dungeon-grid" id="dungeon"></div>
    <div class="dungeon-info">
      <span>📄 찾은 자료: <span id="docCount">0</span> / 4</span>
      <span>🔍 남은 시도: <span id="triesLeft">8</span></span>
    </div>
  `);
  setupDungeon();
}

function setupDungeon() {
  if (state.gameOver) return;
  const grid = document.getElementById('dungeon');
  const tiles = Array(16).fill('empty');
  const pool = [...Array(16).keys()];
  for (let i = pool.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [pool[i], pool[j]] = [pool[j], pool[i]];
  }
  pool.slice(0, 4).forEach(i => tiles[i] = 'doc');
  pool.slice(4, 7).forEach(i => tiles[i] = 'trap');

  const labels = ['📁','📂','📦','📋','🗂','📑','📃','📄','🗃','📜','📝','🗄','📊','📈','📉','🗞'];
  let tries = 8, found = 0;

  tiles.forEach((type, i) => {
    const t = document.createElement('div');
    t.className = 'tile';
    t.textContent = labels[i];
    t.style.touchAction = 'manipulation';
    t.style.userSelect = 'none';
    t.style.webkitUserSelect = 'none';

    let lastTapTime = 0;
    const TAP_DEBOUNCE = 300; // 300ms 내 중복 호출 무시

    const handleTap = (e) => {
      // 디바운스: 연속 호출 방지 (touchend + click 중복 방지)
      const now = Date.now();
      if (now - lastTapTime < TAP_DEBOUNCE) return;
      lastTapTime = now;

      if (t.classList.contains('opened') || tries <= 0 || state.gameOver) return;
      t.classList.add('opened');
      tries--;
      document.getElementById('triesLeft').textContent = tries;
      if (type === 'doc') {
        t.classList.add('found');
        t.textContent = '✅';
        found++;
        state.docs++;
        document.getElementById('docCount').textContent = found;
        toast('자료 발견! 👍');
        if (found === 4) {
          setTimeout(() => {
            hpChange(10, '인수인계 컴플리트');
            setTimeout(screenDay2, 1200);
          }, 400);
        }
      } else if (type === 'trap') {
        t.classList.add('trap');
        t.textContent = '💣';
        hpChange(-8, '개인 PC에 숨겨둔 자료…');
      } else {
        t.textContent = '❌';
      }
      if (tries === 0 && found < 4) {
        setTimeout(() => {
          hpChange(-15, '자료 못 찾아서 맨땅 헤딩');
          setTimeout(screenDay2, 1200);
        }, 400);
      }
    };

    // touchend: 터치가 완료되고 손이 떨어질 때 즉시 반응 (모바일)
    t.addEventListener('touchend', (e) => {
      e.preventDefault(); // click 이벤트 후속 발동 방지
      handleTap(e);
    }, { passive: false });

    // click: 데스크탑 마우스 클릭용
    t.addEventListener('click', handleTap);

    grid.appendChild(t);
  });
}

function showQuizQuestion() {
  if (state.gameOver) return;
  const q = state.quiz.questions[state.quiz.idx];
  if (!q) { finishQuiz(); return; }

  const choices = [...q.choices].sort(() => Math.random() - 0.5);
  const dots = state.quiz.questions.map((_, i) => {
    let cls = '';
    if (i < state.quiz.idx) {
      cls = (state.quiz.results && state.quiz.results[i]) ? 'correct' : 'wrong';
    } else if (i === state.quiz.idx) {
      cls = 'current';
    }
    return `<div class="quiz-dot ${cls}"></div>`;
  }).join('');

  render(`
    ${hud('DAY 2.5')}
    <div class="quiz-question-num">문제 ${state.quiz.idx + 1} / ${state.quiz.questions.length}</div>
    <div class="quiz-progress">${dots}</div>

    <div class="meeting-room">
      <div id="quizTimer" class="meeting-timer">7</div>
      <div class="ceo-speaker">
        <div class="ceo-bubble">"자, 이 단어의 뜻은? <b>빨리빨리!</b>"</div>
      </div>
      <div class="meeting-screen">
        <div class="quiz-term">${q.term}</div>
      </div>
    </div>

    <div class="btn-stack">
      ${choices.map((c, i) => `
        <button class="btn" onclick="answerQuiz(${c.correct})">
          <span class="tag">${String.fromCharCode(65 + i)}</span>
          ${c.label}
        </button>
      `).join('')}
    </div>
  `);

  // 7초 타이머 시작
  startQuizTimer();
}

function startQuizTimer() {
  // 기존 타이머 정리
  if (state.quiz._timerInterval) clearInterval(state.quiz._timerInterval);

  let timeLeft = 7;
  const timerEl = document.getElementById('quizTimer');
  if (!timerEl) return;
  timerEl.textContent = timeLeft;

  state.quiz._timerInterval = setInterval(() => {
    if (state.gameOver) {
      clearInterval(state.quiz._timerInterval);
      return;
    }
    timeLeft--;
    const el = document.getElementById('quizTimer');
    if (!el) {
      clearInterval(state.quiz._timerInterval);
      return;
    }
    el.textContent = timeLeft;
    if (timeLeft <= 3) el.classList.add('urgent');
    if (timeLeft <= 0) {
      clearInterval(state.quiz._timerInterval);
      // 시간 초과 → 자동 오답
      answerQuiz(false, true);
    }
  }, 1000);
}

function answerQuiz(isCorrect, timeout) {
  if (state.gameOver) return;
  // 타이머 중지
  if (state.quiz._timerInterval) {
    clearInterval(state.quiz._timerInterval);
    state.quiz._timerInterval = null;
  }

  if (!state.quiz.results) state.quiz.results = [];
  state.quiz.results[state.quiz.idx] = isCorrect;

  const q = state.quiz.questions[state.quiz.idx];
  if (isCorrect) state.quiz.correct++;
  else state.quiz.wrong++;

  let resultLabel;
  let resultClass;
  if (timeout) {
    resultLabel = '⏱ 시간 초과!';
    resultClass = 'wrong';
  } else if (isCorrect) {
    resultLabel = '✅ 정답!';
    resultClass = 'correct';
  } else {
    resultLabel = '❌ 오답';
    resultClass = 'wrong';
  }

  render(`
    ${hud('DAY 2.5')}
    <div class="quiz-question-num">문제 ${state.quiz.idx + 1} / ${state.quiz.questions.length}</div>
    <div class="quiz-result-big ${resultClass}">${resultLabel}</div>
    <div class="quiz-answer-reveal">
      <div class="term">${q.term}</div>
      <div class="desc">${q.desc}</div>
    </div>
    <div class="quiz-hint" style="text-align:center;">💡 ${q.hint}</div>
    <div class="btn-stack">
      <button class="btn primary" onclick="nextQuiz()">
        ${state.quiz.idx + 1 < state.quiz.questions.length ? '다음 문제 →' : '결과 보기 →'}
      </button>
    </div>
  `);
}

function nextQuiz() {
  if (state.gameOver) return;
  state.quiz.idx++;
  if (state.quiz.idx >= state.quiz.questions.length) {
    finishQuiz();
  } else {
    showQuizQuestion();
  }
}

function finishQuiz() {
  if (state.gameOver) return;
  const { correct, wrong } = state.quiz;
  let hpDelta = 0;
  let verdict = '';
  let grade = '';

  if (correct === 3) {
    hpDelta = 18;
    grade = '🏆 S급 (만점)';
    verdict = '"혹시 이 업계 오래 계셨어요?" 대표님 눈빛에 존경이 담김';
  } else if (correct === 2) {
    hpDelta = 8;
    grade = '🥇 A급';
    verdict = '"오, 좀 아시는데요?" 팀 단톡방에서 인정받음';
  } else if (correct === 1) {
    hpDelta = -8;
    grade = '🥉 C급';
    verdict = '"공부 좀 하셔야겠어요" 우회적 권고 발생';
  } else {
    hpDelta = -15;
    grade = '💀 F급';
    verdict = '"이 판에 뛰어들었으면 기본은 알아야죠" 대표님 실망 게이지 max';
  }

  hpChange(hpDelta, `용어시험 ${correct}/${state.quiz.questions.length}`);

  setTimeout(() => {
    render(`
      ${hud('DAY 2.5')}
      <div class="eyebrow">시험 결과</div>
      <h2>${grade}</h2>
      <div style="background:#1a1a1a;color:#fff;padding:20px;margin:16px 0;text-align:center;border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);">
        <div style="font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:2px;color:#aaa;margin-bottom:8px;">정답 / 전체</div>
        <div style="font-family:'Black Han Sans';font-size:56px;color:var(--yellow);letter-spacing:-1px;">

function setupTitanGame(tasks) {
  if (state.gameOver) return;
  const arena = document.getElementById('titanArena');
  const player = document.getElementById('titanPlayer');
  const arenaRect = () => arena.getBoundingClientRect();

  // 3 lanes: left/center/right (player lane index)
  const LANES = 3;
  let playerLane = 1; // center
  let timeLeft = 15;
  let score = 0;
  let missed = 0;
  let running = true;
  const titans = []; // active titan objects

  function positionPlayer() {
    const w = arena.offsetWidth;
    const laneW = w / LANES;
    const left = laneW * playerLane + laneW / 2;
    player.style.transition = 'left 0.15s ease-out';
    player.style.left = left + 'px';
    player.style.transform = 'translateX(-50%)';
  }
  positionPlayer();

  function moveLeft() {
    if (playerLane > 0) playerLane--;
    positionPlayer();
  }
  function moveRight() {
    if (playerLane < LANES - 1) playerLane++;
    positionPlayer();
  }

  // Keyboard
  const keyHandler = (e) => {
    if (!running) return;
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') { moveLeft(); e.preventDefault(); }
    if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') { moveRight(); e.preventDefault(); }
  };
  window.addEventListener('keydown', keyHandler);

  // Touch/click on arena — tap한 lane으로 바로 이동 (모바일 친화적)
  const tapHandler = (clientX) => {
    if (!running) return;
    const rect = arena.getBoundingClientRect();
    const x = clientX - rect.left;
    const laneW = rect.width / LANES;
    // 탭한 위치의 lane 번호 계산
    const targetLane = Math.max(0, Math.min(LANES - 1, Math.floor(x / laneW)));
    playerLane = targetLane;
    positionPlayer();
  };
  arena.addEventListener('touchstart', (e) => {
    e.preventDefault();
    if (e.touches && e.touches[0]) tapHandler(e.touches[0].clientX);
  }, { passive: false });
  arena.addEventListener('click', (e) => {
    tapHandler(e.clientX);
  });

  // Spawn titans
  const spawnInterval = setInterval(() => {
    if (!running) return;
    spawnTitan();
  }, 700);
  state._titanTimers.push(spawnInterval);

  function spawnTitan() {
    const w = arena.offsetWidth;
    const laneW = w / LANES;
    const lane = Math.floor(Math.random() * LANES);
    const task = tasks[Math.floor(Math.random() * tasks.length)];

    // 5종 거인 중 랜덤 선택
    const titanIdx = 1 + Math.floor(Math.random() * 5);
    const titanSrc = SPRITES['titan' + titanIdx];

    const t = document.createElement('div');
    t.className = 'titan';
    t.innerHTML = `<img class="titan-img" src="${titanSrc}" alt="거인"><span class="titan-label">${task}</span>`;
    const left = laneW * lane + laneW / 2 - 36; // center titan (width 72)
    t.style.left = left + 'px';
    t.style.top = '-100px';
    arena.appendChild(t);

    const titanObj = {
      el: t, lane, task,
      y: -100,
      speed: 1.8 + Math.random() * 1.2,
      alive: true,
    };
    titans.push(titanObj);
  }

  // Game loop - requestAnimationFrame 기반 (모바일 렉 방지)
  let gameLoopId = null;
  let lastFrameTime = 0;

  function gameFrame(currentTime) {
    if (!running) {
      gameLoopId = null;
      return;
    }

    // delta time 계산 (프레임 드랍 시 일정 속도 유지)
    if (!lastFrameTime) lastFrameTime = currentTime;
    const deltaMs = currentTime - lastFrameTime;
    lastFrameTime = currentTime;

    // 16ms 기준 속도 보정 (60fps 기준)
    const speedMultiplier = Math.min(deltaMs / 16, 3); // 최대 3배까지만 (큰 프레임 드랍 방지)

    const arenaH = arena.offsetHeight;
    const playerY = arenaH - 90;

    for (const t of titans) {
      if (!t.alive) continue;
      t.y += t.speed * speedMultiplier;
      t.el.style.top = t.y + 'px';

      // Collision: same lane & y reached player area
      if (t.lane === playerLane && t.y >= playerY - 40 && t.y <= playerY + 50) {
        // Slay
        t.alive = false;
        score++;
        document.getElementById('tScore').textContent = score;

        // Attack animation
        player.classList.add('attack');
        setTimeout(() => player.classList.remove('attack'), 300);

        // ⚡ 검격 광선 (비스듬한 검섬광)
        const fx = document.createElement('div');
        fx.className = 'slash-fx';
        fx.style.left = (parseFloat(t.el.style.left) - 20) + 'px';
        fx.style.top = (t.y + 40) + 'px';
        arena.appendChild(fx);
        setTimeout(() => fx.remove(), 400);

        // ✨ 충돌 지점 빛 플래시
        const flash = document.createElement('div');
        flash.className = 'blood-splat';
        flash.style.left = (parseFloat(t.el.style.left) - 4) + 'px';
        flash.style.top = (t.y + 20) + 'px';
        arena.appendChild(flash);
        setTimeout(() => flash.remove(), 500);

        // 💫 사방으로 퍼지는 광선 빔 (8방향)
        const angles = [0, 45, 90, 135, 180, 225, 270, 315];
        angles.forEach((angle, i) => {
          const beam = document.createElement('div');
          beam.className = 'steam-puff';
          beam.style.setProperty('--beam-angle', angle + 'deg');
          beam.style.left = (parseFloat(t.el.style.left) + 6) + 'px';
          beam.style.top = (t.y + 40) + 'px';
          beam.style.animationDelay = (i * 0.02) + 's';
          arena.appendChild(beam);
          setTimeout(() => beam.remove(), 700);
        });

        // Task popup
        const pop = document.createElement('div');
        pop.className = 'task-popup';
        pop.textContent = '✓ ' + t.task;
        pop.style.left = (parseFloat(t.el.style.left) - 10) + 'px';
        pop.style.top = (t.y - 10) + 'px';
        arena.appendChild(pop);
        setTimeout(() => pop.remove(), 900);

        t.el.classList.add('slain');
        setTimeout(() => t.el.remove(), 400);
      } else if (t.y > arenaH - 20) {
        // Missed
        t.alive = false;
        missed++;
        document.getElementById('tMissed').textContent = missed;
        t.el.style.background = '#888';
        t.el.style.opacity = '0.4';
        setTimeout(() => t.el.remove(), 500);
      }
    }

    gameLoopId = requestAnimationFrame(gameFrame);
  }
  gameLoopId = requestAnimationFrame(gameFrame);

  // Timer
  const timerInterval = setInterval(() => {
    timeLeft--;
    document.getElementById('tTimer').textContent = Math.max(0, timeLeft);
    if (timeLeft <= 0) {
      running = false;
      clearInterval(timerInterval);
      clearInterval(spawnInterval);
      if (gameLoopId) cancelAnimationFrame(gameLoopId);
      window.removeEventListener('keydown', keyHandler);

      setTimeout(() => {
        if (state.gameOver) return;
        if (missed > 3) hpChange(-Math.min(15, missed * 2), `놓친 태스크 ${missed}개`);
        if (state.gameOver) return;
        if (score >= 15) {
          setTimeout(() => hpChange(+15, '태스크 폭격 처리! 🔥'), 800);
          setTimeout(() => { if (!state.gameOver) screenDay4Wasp(); }, 2300);
        } else if (score >= 8) {
          setTimeout(() => hpChange(+8, '그래도 할 만큼 했다'), 800);
          setTimeout(() => { if (!state.gameOver) screenDay4Wasp(); }, 2300);
        } else {
          setTimeout(() => { if (!state.gameOver) screenDay4Wasp(); }, 1400);
        }
      }, 400);
    }
  }, 1000);
  state._titanTimers.push(timerInterval);
  // requestAnimationFrame ID는 gameOver 시 running=false로 자동 종료됨
}

function setupWasps() {
  if (state.gameOver) return;
  const arena = document.getElementById('arena');
  const player = document.getElementById('waspPlayer');
  let timeLeft = 10, handled = 0, combo = 0, missed = 0;
  const vocList = [
    '환불해주세요', '이거 왜 이래요?', '사장 나와', '별점 테러할게요',
    '전화번호 주세요', '당장 고쳐', '기능 추가해주세요', '버그있어요',
    '로그인 안 돼요', '제휴문의', '결제 두 번됨', '앱 켜지는데 10초'
  ];

  // Player follows mouse/touch (X & Y both)
  const playerSize = 100;
  let playerX = arena.offsetWidth / 2;
  let playerY = arena.offsetHeight - playerSize / 2 - 10;
  const updatePlayer = () => {
    player.style.left = (playerX - playerSize / 2) + 'px';
    player.style.top = (playerY - playerSize / 2) + 'px';
    player.style.bottom = 'auto';
    player.style.transform = 'none';
  };
  // 초기 설정 (transition은 한 번만 세팅)
  player.style.transition = 'left 0.15s ease-out, top 0.15s ease-out';
  updatePlayer();

  // 통합 이동 함수: 좌표만 받으면 이동
  const movePlayerTo = (clientX, clientY) => {
    const rect = arena.getBoundingClientRect();
    if (clientX >= rect.left && clientX <= rect.right &&
        clientY >= rect.top && clientY <= rect.bottom) {
      playerX = Math.max(playerSize / 2, Math.min(rect.width - playerSize / 2, clientX - rect.left));
      playerY = Math.max(playerSize / 2, Math.min(rect.height - playerSize / 2, clientY - rect.top));
      updatePlayer();
    }
  };

  // 마우스 이동 (데스크탑)
  const mouseMoveHandler = (e) => {
    movePlayerTo(e.clientX, e.clientY);
  };
  arena.addEventListener('mousemove', mouseMoveHandler);

  // ✅ 모바일: 탭하면 그 위치로 방호복 이동 (말벌 위 탭이든 어디든 무조건 이동)
  const touchMoveHandler = (e) => {
    if (e.touches && e.touches[0]) {
      movePlayerTo(e.touches[0].clientX, e.touches[0].clientY);
    }
  };
  // touchstart: 손가락이 화면에 닿는 순간 방호복 이동
  arena.addEventListener('touchstart', touchMoveHandler, { passive: true });
  // touchmove: 손가락 드래그하면 따라감
  arena.addEventListener('touchmove', touchMoveHandler, { passive: true });

  // 데스크탑 클릭 이동 (모바일은 touchstart에서 이미 처리)
  const clickHandler = (e) => {
    // 말벌을 직접 클릭한 경우는 killWasp가 처리하므로 skip
    if (e.target && e.target.classList && e.target.classList.contains('wasp')) return;
    movePlayerTo(e.clientX, e.clientY);
  };
  arena.addEventListener('click', clickHandler);

  const spawnInterval = setInterval(() => {
    if (timeLeft <= 0) return;
    spawnWasp();
  }, 900);
  state._waspTimers.push(spawnInterval);

  function spawnWasp() {
    const w = document.createElement('div');
    w.className = 'wasp';
    w.textContent = '🐝';
    const rect = arena.getBoundingClientRect();
    const size = 30;
    w.style.left = Math.random() * (rect.width - size) + 'px';
    w.style.top = Math.random() * (rect.height - size - 100) + 'px';

    let alive = true;
    const lifetime = setTimeout(() => {
      if (alive) {
        alive = false; missed++; combo = 0;
        updateCombo(); w.remove();
      }
    }, 2500);

    const killWasp = (e) => {
      if (e) e.preventDefault();
      if (!alive) return;
      alive = false;
      clearTimeout(lifetime);
      handled++; combo++; state.vocHandled++;
      document.getElementById('handled').textContent = handled;
      updateCombo();
      const bubble = document.createElement('div');
      bubble.className = 'voc-bubble';
      bubble.textContent = '"' + vocList[Math.floor(Math.random() * vocList.length)] + '"';
      const waspLeft = parseFloat(w.style.left) || 0;
      const waspTop = parseFloat(w.style.top) || 0;
      bubble.style.left = (waspLeft - 20) + 'px';
      bubble.style.top = (waspTop - 30) + 'px';
      arena.appendChild(bubble);
      setTimeout(() => bubble.remove(), 1300);
      w.remove();
    };
    w.addEventListener('click', killWasp);
    w.addEventListener('touchstart', killWasp, { passive: false });
    arena.appendChild(w);
    // 자동 충돌 감지: 방호복 근처에 오면 자동 처치
    w._killFn = killWasp;
    w._alive = () => alive;
    w._getPos = () => ({
      x: parseFloat(w.style.left) || 0,
      y: parseFloat(w.style.top) || 0,
    });
  }

  function updateCombo() {
    const el = document.getElementById('combo');
    if (combo >= 3) el.textContent = `🔥 ${combo} COMBO`;
    else el.textContent = '';
  }

  // 방호복 근처에 오는 말벌 자동 처치
  const collisionInterval = setInterval(() => {
    if (state.gameOver || timeLeft <= 0) return;
    const waspSize = 30;
    const hitRadius = 60; // 방호복 반경 60px 내 말벌 자동 처치
    const wasps = arena.querySelectorAll('.wasp');
    wasps.forEach(w => {
      if (!w._alive || !w._alive()) return;
      const pos = w._getPos();
      const wCenterX = pos.x + waspSize / 2;
      const wCenterY = pos.y + waspSize / 2;
      const dx = wCenterX - playerX;
      const dy = wCenterY - playerY;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < hitRadius) {
        w._killFn();
      }
    });
  }, 80);
  state._waspTimers.push(collisionInterval);

  const timerInterval = setInterval(() => {
    timeLeft--;
    document.getElementById('timer').textContent = Math.max(0, timeLeft);
    if (timeLeft <= 0) {
      clearInterval(timerInterval);
      clearInterval(spawnInterval);
      setTimeout(() => {
        if (state.gameOver) return;
        const remaining = arena.querySelectorAll('.wasp').length;
        missed += remaining;
        const totalDmg = Math.min(15, missed * 2);
        if (totalDmg > 0) hpChange(-totalDmg, `놓친 CS ${missed}건`);
        if (state.gameOver) return;
        if (handled >= 12) {
          setTimeout(() => hpChange(+12, '"CS 감각 있네요" 칭찬 🌟'), 1000);
          setTimeout(() => { if (!state.gameOver) screenDay5Remote(); }, 2500);
        } else if (handled >= 7) {
          setTimeout(() => hpChange(+5, '그래도 많이 쳐냈다'), 1000);
          setTimeout(() => { if (!state.gameOver) screenDay5Remote(); }, 2500);
        } else {
          setTimeout(() => { if (!state.gameOver) screenDay5Remote(); }, 1500);
        }
      }, 500);
    }
  }, 1000);
  state._waspTimers.push(timerInterval);
}

function decideEnding() {
  if (state.hp <= 0) return 'burnout';
  // 🏛️ 창업자 엔딩: HP 85+ AND 퀴즈 만점 (가장 어려운 조건)
  const aced = state.quiz && state.quiz.correct === state.quiz.questions?.length && state.quiz.questions?.length > 0;
  if (state.hp >= 85 && aced) return 'founder';
  if (state.hp >= 70) return 'exit';
  if (state.hp >= 40) return 'survive';
  if (state.hp >= 20) return 'quit';
  return 'burnout';
}

// ==================== IMAGE GENERATION (Canvas API) ====================
// Generates a shareable image by drawing directly on canvas
// No html2canvas dependency needed

async function generateResultImage() {
  const ending = decideEnding();
  const grade = ending === 'founder' ? 'SS+' : state.hp >= 70 ? 'S' : state.hp >= 50 ? 'A' : state.hp >= 30 ? 'B' : state.hp >= 10 ? 'C' : 'F';
  const jobSprite = state.job ? state.job.sprite : 'danso';
  const burnoutSprite = jobSprite + '_burnout';
  const endings = {
    burnout: { stamp: '번아웃', color: '#ff3b30', sprite: burnoutSprite, title: '휴직계를 냈다' },
    quit:    { stamp: '이직',   color: '#0051ff', sprite: jobSprite, title: '네이버에 원서를 넣었다' },
    survive: { stamp: '존버중', color: '#ffb700', sprite: jobSprite, title: '스톡옵션을 믿기로 했다' },
    exit:    { stamp: '엑싯!',  color: '#00d4a0', sprite: 'exit',    title: '회사가 인수됐다' },
    founder: { stamp: '창업!',  color: '#14b87a', sprite: 'founder', title: '판을 직접 깔기로 했다' },
  };
  const e = endings[ending];

  // Canvas setup - portrait 4:5 ratio for social media
  const W = 720, H = 900;
  const canvas = document.createElement('canvas');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = false;

  // Background
  ctx.fillStyle = '#fffbea';
  ctx.fillRect(0, 0, W, H);

  // Decorative grid pattern
  ctx.strokeStyle = 'rgba(0,0,0,0.04)';
  ctx.lineWidth = 1;
  for (let y = 0; y < H; y += 25) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }

  // Main card with border & shadow
  const cardX = 40, cardY = 50, cardW = W - 80, cardH = H - 130;
  // Shadow
  ctx.fillStyle = '#1a1a1a';
  ctx.fillRect(cardX + 8, cardY + 8, cardW, cardH);
  // Card bg
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(cardX, cardY, cardW, cardH);
  // Card border
  ctx.strokeStyle = '#1a1a1a';
  ctx.lineWidth = 3;
  ctx.strokeRect(cardX, cardY, cardW, cardH);

  // Top eyebrow: "ENDING · 타입"
  ctx.fillStyle = '#ff3b30';
  ctx.font = '600 16px monospace';
  ctx.textAlign = 'left';
  ctx.fillText(`ENDING · ${e.stamp}`.toUpperCase(), cardX + 30, cardY + 40);

  // Load and draw character sprite
  const charImage = new Image();
  charImage.crossOrigin = 'anonymous';
  charImage.src = SPRITES[e.sprite];
  await new Promise((resolve) => {
    if (charImage.complete) resolve();
    else { charImage.onload = resolve; charImage.onerror = resolve; }
  });

  const spriteMaxW = 180;
  const spriteMaxH = 240;
  const spriteY = cardY + 70;
  try {
    // 이미지 비율 유지 (세로 긴 일러스트)
    let drawW = spriteMaxW;
    let drawH = spriteMaxH;
    if (charImage.naturalWidth && charImage.naturalHeight) {
      const ratio = charImage.naturalWidth / charImage.naturalHeight;
      if (ratio > spriteMaxW / spriteMaxH) {
        drawW = spriteMaxW;
        drawH = spriteMaxW / ratio;
      } else {
        drawH = spriteMaxH;
        drawW = spriteMaxH * ratio;
      }
    }
    const spriteX = (W - drawW) / 2;
    ctx.drawImage(charImage, spriteX, spriteY, drawW, drawH);
  } catch (err) {
    console.warn('Sprite draw failed:', err);
  }

  // Stamp badge
  const stampY = spriteY + spriteMaxH + 30;
  ctx.save();
  ctx.translate(W / 2, stampY);
  ctx.rotate(-0.1);
  const stampW = 220, stampH = 70;
  ctx.strokeStyle = e.color;
  ctx.lineWidth = 5;
  ctx.strokeRect(-stampW / 2, -stampH / 2, stampW, stampH);
  ctx.fillStyle = e.color;
  ctx.font = 'bold 52px "Black Han Sans", sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.globalAlpha = 0.9;
  ctx.fillText(e.stamp, 0, 4);
  ctx.restore();
  ctx.globalAlpha = 1;

  // Title
  ctx.fillStyle = '#1a1a1a';
  ctx.font = 'bold 28px "Black Han Sans", sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'alphabetic';
  ctx.fillText(`당신은 결국 ${e.title}`, W / 2, stampY + 90);

  // Stats box
  const statsY = stampY + 130;
  const statsX = cardX + 30;
  const statsW = cardW - 60;
  const statsH = 180;
  ctx.fillStyle = '#f7f7f2';
  ctx.fillRect(statsX, statsY, statsW, statsH);
  ctx.strokeStyle = '#1a1a1a';
  ctx.lineWidth = 2;
  ctx.strokeRect(statsX, statsY, statsW, statsH);

  const stats = [
    ['최종 HP', `${state.hp} / ${state.maxHp}`],
    ['플레이 직군', state.job?.name || '-'],
    ['찾은 자료', `${state.docs} / 4`],
    ['처리한 VOC', `${state.vocHandled}건`],
  ];
  ctx.font = '600 17px monospace';
  ctx.textAlign = 'left';
  stats.forEach((row, i) => {
    const y = statsY + 30 + i * 30;
    ctx.fillStyle = '#666';
    ctx.fillText(row[0], statsX + 16, y);
    ctx.fillStyle = '#1a1a1a';
    ctx.textAlign = 'right';
    ctx.fillText(row[1], statsX + statsW - 16, y);
    ctx.textAlign = 'left';
    if (i < stats.length - 1) {
      ctx.strokeStyle = '#ccc';
      ctx.setLineDash([2, 3]);
      ctx.beginPath();
      ctx.moveTo(statsX + 8, y + 10);
      ctx.lineTo(statsX + statsW - 8, y + 10);
      ctx.stroke();
      ctx.setLineDash([]);
    }
  });

  // Grade — big accent
  const gradeY = statsY + statsH + 30;
  ctx.font = 'bold 14px monospace';
  ctx.fillStyle = '#999';
  ctx.textAlign = 'center';
  ctx.fillText('생존 등급', W / 2, gradeY);
  ctx.font = 'bold 72px "Black Han Sans", sans-serif';
  ctx.fillStyle = e.color;
  ctx.fillText(grade, W / 2, gradeY + 70);

  // Bottom branding
  ctx.fillStyle = '#1a1a1a';
  ctx.font = 'bold 22px "Black Han Sans", sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('🚀 스타트업 생존기 · 직장인편', W / 2, H - 45);

  ctx.fillStyle = '#888';
  ctx.font = '500 13px monospace';
  ctx.fillText('너도 한번 버텨봐 ↓', W / 2, H - 20);

  return canvas;
}

function downloadImage() {
  toast('이미지 만드는 중... 🎨', 'heal');
  generateResultImage().then((canvas) => {
    const grade = state.hp >= 70 ? 'S' : state.hp >= 50 ? 'A' : state.hp >= 30 ? 'B' : state.hp >= 10 ? 'C' : 'F';
    canvas.toBlob((blob) => {
      if (!blob) {
        toast('이미지 생성 실패 😭', 'dmg');
        return;
      }
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.download = `startup-survivor-${state.job?.name || 'unknown'}-${grade}.png`;
      link.href = url;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      setTimeout(() => {
        URL.revokeObjectURL(url);
        toast('저장 완료! 📸', 'heal');
      }, 300);
    }, 'image/png');
  }).catch((err) => {
    console.error('Image gen failed:', err);
    toast('이미지 생성 실패 😭\n스크린샷으로 찍어주세요', 'dmg');
  });
}

  }[ending] || '???';

  // 결과 + 링크 함께 포함된 메시지
  const shareText = `🚀 스타트업 생존기: 직장인편\n\n👤 직군: ${state.job?.name || '?'}\n❤️ HP: ${state.hp}/100\n🏆 등급: ${grade}\n🎬 엔딩: ${endingName}\n\n너도 한번 버텨봐 👇\n${gameUrl}`;

  // ✅ 먼저 클립보드에 복사 (이미지 공유 후에도 링크는 남아있게)
  copyToClipboard(shareText).catch(() => {});

  toast('📋 결과+링크 복사됨! 이미지 준비 중...', 'heal');

  // Generate image + share with file + text + URL all in one
  generateResultImage().then((canvas) => {
    canvas.toBlob(async (blob) => {
      if (!blob) {
        // 이미지 생성 실패 → 텍스트만 공유/복사
        shareTextOnly(shareText);
        return;
      }

      const file = new File([blob], 'startup-survivor-result.png', { type: 'image/png' });

      // 📱 모바일: Web Share API로 이미지 공유 (카톡/인스타/메시지)
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        try {
          await navigator.share({
            title: '스타트업 생존기: 직장인편',
            text: shareText,
            files: [file],
          });
          // 공유 완료 후에도 클립보드에 텍스트 남아있음
          setTimeout(() => {
            toast('✅ 공유 완료!\n📋 링크는 이미 복사돼있어요', 'heal');
          }, 300);
          return;
        } catch (err) {
          if (err.name === 'AbortError') {
            // 사용자가 공유 취소 — 하지만 클립보드에는 이미 복사됨
            toast('💡 결과+링크는 클립보드에 복사됐어요!\n붙여넣기 해보세요 📋', 'heal');
            return;
          }
        }
      }

      // 📱 iOS Safari 일부 케이스 - 텍스트만 공유
      if (navigator.share) {
        try {
          await navigator.share({
            title: '스타트업 생존기: 직장인편',
            text: shareText,
          });
          // 이미지는 다운로드로
          setTimeout(() => {
            downloadImage();
            toast('✅ 공유 완료!\n이미지는 갤러리에 저장됨 📸', 'heal');
          }, 300);
          return;
        } catch (err) {
          if (err.name === 'AbortError') {
            toast('💡 결과+링크는 클립보드에 복사됐어요!\n붙여넣기 해보세요 📋', 'heal');
            return;
          }
        }
      }

      // 🖥 데스크탑: 텍스트 이미 복사됨 + 이미지 다운로드
      downloadImage();
      toast('📋 결과+링크 복사됨!\n📸 이미지도 다운로드됐어요\n카톡에 붙여넣고 이미지 첨부!', 'heal');
    }, 'image/png');
  }).catch(() => {
    shareTextOnly(shareText);
  });
}

function shareTextOnly(text) {
  // 이미지 없이 텍스트만
  if (navigator.share) {
    navigator.share({
      title: '스타트업 생존기: 직장인편',
      text: text,
    }).catch(() => {});
  }
  // 클립보드에는 이미 복사됨
  toast('📋 결과+링크 복사됨!\n카톡에 붙여넣기 하세요', 'heal');
}

function copyResultAndUrl(text) {
  copyToClipboard(text).then(() => {
    toast('결과 + 링크 복사됨! 📋\n카톡에 붙여넣기 해보세요', 'heal');
  }).catch(() => {
    toast('복사 실패 😭\n직접 스크린샷 찍어주세요', 'dmg');
  });
}

  copyToClipboard(text).then(() => {
    toast('결과 + 링크 복사됨! 📋\n카톡에 붙여넣기 해보세요', 'heal');
  }).catch(() => {
    toast('복사 실패 😭\n직접 스크린샷 찍어주세요', 'dmg');
  });
}

function copyToClipboard(text) {
  if (navigator.clipboard && window.isSecureContext) {
    return navigator.clipboard.writeText(text);
  }
  return new Promise((resolve, reject) => {
    try {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.left = '-9999px';
      ta.style.top = '0';
      ta.setAttribute('readonly', '');
      document.body.appendChild(ta);
      ta.select();
      ta.setSelectionRange(0, 99999);
      const ok = document.execCommand('copy');
      document.body.removeChild(ta);
      if (ok) resolve(); else reject(new Error('execCommand failed'));
    } catch (e) {
      reject(e);
    }
  });
}
